# 自监督预训练配置（MAE）- 合并mvtec_ad和zhenyu_data数据
ssl:
  # 模型配置
  model:
    backbone: "vit_base"  # 可选: vit_base, resnet50, convnext_base
    backbone_pretrained: true  # 是否使用ImageNet预训练权重
    image_size: 224
    patch_size: 16  # ViT的patch size
    mask_ratio: 0.5  # MAE的mask比例
    decoder_dim: 512
    decoder_depth: 8
    decoder_num_heads: 16
  
  # 数据配置
  data:
    # 合并多个数据集文件
    metadata_files:
      - "data/mvtec_ad/metadata/ssl_dataset.json"
      - "data/zhenyu_data/metadata/ssl_dataset.json"
    batch_size: 32
    num_workers: 4
    pin_memory: true
    domain_balanced: false  # 是否使用domain平衡采样
  
  # 数据增强配置（工业图像专用）
  augmentation:
    random_crop:
      scale: [0.4, 1.0]
      enabled: true
    horizontal_flip:
      prob: 0.5
      enabled: true
    vertical_flip:
      prob: 0.3
      enabled: true
    rotation:
      degrees: 15
      enabled: true
    color_jitter:
      brightness: 0.1
      contrast: 0.1
      saturation: 0.05
      hue: 0.02
      enabled: false
    gaussian_noise:
      std: 0.01
      enabled: false
    blur:
      enabled: false  # 工业图像通常不适用强blur
  
  # 训练配置
  training:
    epochs: 100
    warmup_epochs: 10
    learning_rate: 1e-4
    weight_decay: 0.05
    optimizer: "adamw"
    lr_scheduler: "cosine"
    save_interval: 10  # 每N个epoch保存一次
    eval_interval: 10  # 每N个epoch评估一次
  
  # 输出配置
  output:
    checkpoint_dir: "checkpoints/ssl_merged"
    log_dir: "logs/ssl_merged"
    use_wandb: true
    wandb_project: "industrial-ssl-merged"

