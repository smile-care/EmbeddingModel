# 对比学习相似度配置文件
# 用于设置不同缺陷类别之间的相似度关系


root: "data/datasets/zhenyu"
data_split:
  train: "train"
  val: "val"

categories: ["笔迹", "变形1", "变形2", "错装1", "错装2", "错装3", "断焊", "多装1", "多装2", "发亮", "飞边", 
            "焊包", "焊道划伤", "焊洞", "焊偏", "焊烟", "焊渣", "划伤1", "划伤2", "间隙大", "金属丝", "开裂", 
            "漏装", "毛刺", "磨花1", "磨花2", "碰伤", "破损", "起翘1", "起翘2", "缺口", "手指印", "歪斜1", "歪斜2",
            "污渍", "压伤", "氧化", "异物1-人造", "异物2-黑点", "异物3-杂物、灰尘、黑线", "异物遮蔽", "溢胶", 
            "折痕", "装反1", "装反2", "装反3", "装配错位", "R角凸起"]

default_similarity: 0.0

