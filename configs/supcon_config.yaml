# 监督对比学习配置（SupCon）
# "facebook/dinov3-convnext-tiny-pretrain-lvd1689m"
# "facebook/dinov3-convnext-small-pretrain-lvd1689m"
# "facebook/dinov3-convnext-base-pretrain-lvd1689m",
# "facebook/dinov3-convnext-large-pretrain-lvd1689m",

supcon:
  model:
    model_name: "facebook/dinov3-convnext-tiny-pretrain-lvd1689m"
    embedding_dim: 128
    projection_head:
      hidden_dims: [256, 128]
    use_layers: [0, 1, 2, 3]  # 4x, 8x, 16x, 32x 下采样层的输出特征
    fpn_out_channels: 256
    fusion_dim: 512
  
  data:
    image_size: [224, 320, 448]  # 支持单个整数或整数列表，如: 224 或 [224, 320, 448]
    batch_size: 32
    num_workers: 4
    pin_memory: true
  
  training:
    epochs: 500
    learning_rate: 1e-4
    weight_decay: 0.05
    backbone_lr_ratio: 0.1  # backbone学习率比例
    lr_scheduler: "cosine"
    save_interval: 50  # 每隔多少epoch保存一次模型
  
  training_strategy:
    freeze_backbone_epochs: 10000  # 冻结backbone的epoch数（0表示不冻结）
  
  loss:
    supcon:
      weight: 1.0
      temperature: 0.07
    # 相似度矩阵配置
    use_similarity_matrix: false  # 是否使用相似度矩阵（true: 使用，false: 使用标准SupCon，仅同label为positive）
    # 负样本惩罚配置（用于优化负样本分离）
    neg_weight: 0.5  # 负样本惩罚权重（0-1之间，越大负样本分离越强，建议0.3-0.7）
    margin: 0.0  # 正负样本margin（0表示不使用margin，建议0.0-0.2，确保正样本相似度至少比负样本高margin）
  
  # MoCo配置（动量对比学习，适合小batch size）
  moco:
    enabled: true  # 是否启用MoCo（true: 使用MoCo，false: 使用标准SupCon）
    momentum: 0.995  # 动量系数（默认0.999，越大更新越慢）
    queue_size: 16384  # 负样本队列大小（默认16384，适合显存受限；可设置为32768或65536）
    loss_type: "supervised"  # loss类型："supervised"（使用相似度矩阵）或 "standard"（标准MoCo InfoNCE）
  
  # 输出配置
  output:
    checkpoint_dir: "checkpoints/supcon_models/1229-2"
    log_dir: "logs/supcon_logs/1229-2"
    use_wandb: true
    wandb_project: "supcon_moco"

