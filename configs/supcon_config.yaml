# 监督对比学习配置（SupCon）
# "facebook/dinov3-convnext-tiny-pretrain-lvd1689m"
# "facebook/dinov3-convnext-small-pretrain-lvd1689m"
# "facebook/dinov3-convnext-base-pretrain-lvd1689m",
# "facebook/dinov3-convnext-large-pretrain-lvd1689m",

supcon:
  model:
    model_name: "facebook/dinov3-convnext-tiny-pretrain-lvd1689m"
    embedding_dim: 128
    projection_head:
      hidden_dims: [256, 128]
    use_layers: [1, 2, 3, 4]  # 使用哪些层的特征
    fpn_out_channels: 256
    fusion_dim: 512
  
  data:
    batch_size: 128
    num_workers: 4
    pin_memory: true
  
  training:
    epochs: 10
    learning_rate: 1e-4
    weight_decay: 0.05
    backbone_lr_ratio: 0.1  # backbone学习率比例
    lr_scheduler: "cosine"
    save_interval: 20  # 每隔多少epoch保存一次模型
  
  training_strategy:
    freeze_backbone_epochs: 10000  # 冻结backbone的epoch数（0表示不冻结）
  
  loss:
    type: "contrastive"  # "contrastive" 或 "target"
    # contrastive: 标准对比loss，使用相似度作为权重
    # target: MSE loss，使用相似度作为目标值
    supcon:
      weight: 1.0
      temperature: 0.07
  
  augmentation:
    image_size: 224
    random_crop:
      enabled: true
      scale: [0.7, 1.0]
    horizontal_flip:
      enabled: true
      prob: 0.5
    color_jitter:
      enabled: true
  
  # 输出配置
  output:
    checkpoint_dir: "checkpoints/supcon_models/1219-1"
    log_dir: "logs/supcon_logs/1219-1"
    use_wandb: true
    wandb_project: "supcon_1219"

