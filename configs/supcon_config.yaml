# ============================================================
# 监督对比学习训练配置（SupCon / MoCo）
# ============================================================
#
# 切换 backbone 只需修改下方 model.backbone 一个字段：
#
#   ConvNeXt 系列：
#     convnext_tiny   convnext_small   convnext_base   convnext_large
#
#   ViT 系列：
#     vits16   vits16plus   vitb16   vitl16   vith16plus   vit7b16
#
# backbone 对应的架构参数文件：configs/backbone/<backbone>.yaml
# backbone 对应的预训练权重文件：pretrain_ckpts/<backbone>.pth
# ============================================================

supcon:
  model:
    backbone: "convnext_tiny"   # ← 只改这里来切换 backbone

    embedding_dim: 256          # ProjectionHead 输出维度 z（对比学习监督空间）

    # ----------------------------------------------------------
    # ConvNeXt 管线专用参数（backbone 为 convnext_* 时生效）
    # ----------------------------------------------------------
    convnext:
      use_layers: [1, 2, 3]     # 原生多层 mask pooling 的 stage 索引（0=4x, 1=8x, 2=16x, 3=32x）
      fusion_dim: 768           # FeatureFusion 输出维度 h（应用分析表征空间）
      projection_hidden_dim: 1024
      mask_gating:
        enabled: true
        init_gamma: 0.0
        per_layer: true
      pooling:
        mode: "fg_only"

    # ----------------------------------------------------------
    # ViT 管线专用参数（backbone 为 vit* 时生效）
    # ----------------------------------------------------------
    vit:
      cls_weight: 0.4           # CLS token 混合比例（0=纯 patch pooling, 1=纯 CLS）

  data:
    data_config_path: "configs/data_config.yaml"
    image_size: [224]           # 支持单值或列表（多尺度随机采样），如 [224, 320, 448]
    batch_size: 32
    num_workers: 4
    pin_memory: true
    mask_dilation:
      enabled: false

  training:
    epochs: 150
    learning_rate: 1.0e-4
    weight_decay: 0.05
    backbone_lr_ratio: 0.4     # backbone 学习率 = learning_rate × backbone_lr_ratio
    lr_scheduler: "cosine"
    save_interval: 50

  training_strategy:
    # 0 = 全程微调（推荐，backbone 用低学习率 backbone_lr_ratio 保护）
    # N > 0 = 先冻 N 个 epoch 训练 head，再整体微调（适合数据量极少时）
    freeze_backbone_epochs: 0

  loss:
    supcon:
      weight: 1.0
      temperature: 0.1         # batch 较小时用 0.1 更稳定，稳定后可尝试降到 0.07
    neg_weight: 0.2            # 额外负样本惩罚权重，标准对比 loss 已隐式推开负样本，不宜过高
    margin: 0.0                # 固定 margin 在训练初期有副作用，建议保持 0
  moco:
    enabled: true  # 是否启用MoCo（true: 使用MoCo，false: 使用标准SupCon）
    momentum: 0.995  # 动量系数（默认0.999，越大更新越慢）
    queue_size: [1024, 16000]  # 负样本队列大小，支持 int 或 [min, max]（自适应时按样本数裁剪到此区间）
    loss_type: "supervised"  # loss类型："supervised"（使用相似度矩阵）或 "standard"（标准MoCo InfoNCE）
    queue_device: "gpu"  # 队列存放设备："cpu"（训练时搬到GPU，显存友好）或 "gpu"（常驻GPU，速度更快）

  inference:
    embedding_source: "representations"  # representations=FeatureFusion输出h，projections=ProjectionHead输出z
  
  # 输出配置
  output:
    checkpoint_dir: "checkpoints/supcon_models/0701_convnext_tiny"
    log_dir: "logs/supcon_logs/0701_convnext_tiny"
    use_wandb: true
    wandb_project: "supcon_logs-0701_convnext_tiny"
