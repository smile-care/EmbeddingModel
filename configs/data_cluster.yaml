# ============================================================
# DataCluster 平台配置文件
# 此文件为 DataCluster 模块的独立配置，包括：
#   1. 各 backbone 对应的预训练权重路径
#   2. Web UI 训练/数据加载默认参数（epochs、batch_size 等）
#   3. 存储路径
#
# 模型架构 / MoCo / 损失 与命令行训练共用 configs/supcon_config.yaml，
# 由 supcon_config_path 指定，避免两套参数不一致导致权重无法复用。
#
# 注意：训练默认会加载下方 backbones.<backbone>.pretrained_path 指定的
#       backbone 预训练权重（除非实验 config 显式提供 pretrainedPath 覆盖）。
# ============================================================

data_cluster:

  # 与 scripts/train_supcon.py 共用的 SupCon 配置（model / moco / loss 等）
  supcon_config_path: "configs/supcon_config.yaml"

  # ---------- Backbone 预训练权重配置 ----------
  # key 对应 exp config 中的 backbone 参数
  backbones:
    convnext_tiny:
      backbone_config: "configs/backbone/convnext_tiny.yaml"
      pretrained_path: "checkpoints/supcon_models/0701_convnext_tiny/checkpoint_epoch_100.pth"
    # convnext_small:
    #   backbone_config: "configs/backbone/convnext_small.yaml"
    #   pretrained_path: "pretrain_ckpts/dinov3_convnext_small.pth"
    # convnext_base:
    #   backbone_config: "configs/backbone/convnext_base.yaml"
    #   pretrained_path: "pretrain_ckpts/dinov3_convnext_base.pth"
    # convnext_large:
    #   backbone_config: "configs/backbone/convnext_large.yaml"
    #   pretrained_path: "pretrain_ckpts/dinov3_convnext_large.pth"

  # ---------- 训练默认参数 ----------
  # Web UI 创建实验时可覆盖这些值
  training:
    default_backbone: "convnext_tiny"
    epochs: 50
    learning_rate: 1e-4
    weight_decay: 0.05
    backbone_lr_ratio: 0.1
    save_interval: 5
    use_amp: false
    eval_interval: 1
    lr_scheduler: "cosine"   # 'cosine' | 'step'

  training_strategy:
    freeze_backbone_epochs: 100

  # ---------- 数据默认参数（Web 平台 DataLoader；mask 增强默认开启） ----------
  data:
    image_size: 224
    batch_size: 16
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
    repeat_factor: 1
    mask_dilation:
      enabled: false
      method: "fast_pool"
      fast_gamma: 0.8

  # ---------- 输出默认 ----------
  output:
    log_dir: "logs/data_cluster"
