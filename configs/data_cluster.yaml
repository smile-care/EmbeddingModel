# ============================================================
# DataCluster 平台配置文件
# 此文件为 DataCluster 模块的独立配置，包括：
#   1. 各架构变体对应的预训练 Embedding 模型权重路径
#   2. Web UI 训练/数据加载默认参数（total_steps、batch_size 等）
#   3. 存储路径
#
# 注意：训练默认会加载下方 pretrained_models.<backbone>.pretrained_path 指定的
#       预训练权重（完整 SupCon 或仅 backbone；实验 config 可显式覆盖 pretrainedPath）。
# ============================================================

data_cluster:

  # 与 scripts/train_supcon.py 共用的 SupCon 配置（model / moco / loss 等）
  supcon_config_path: "configs/supcon_config.yaml"

  # ---------- SupCon 应用侧 Embedding 来源 ----------
  # representations = FeatureFusion 输出 h，适合 Data Cluster 特征分析（默认）
  # projections      = ProjectionHead 输出 z，适合观察对比学习监督空间
  inference:
    embedding_source: "projections"

  # ---------- 预训练 Embedding 模型配置 ----------
  # key：与实验 config 的 backbone 字段一致（架构标识，如 convnext_tiny），不是「仅 backbone 权重」。
  # 每项包含：
  #   backbone_config  - 该变体的 backbone 架构定义（configs/backbone/*.yaml）
  #   pretrained_path  - Web 训练启动时加载的默认权重（见下方说明）
  #
  # pretrained_path 支持两类 checkpoint：
  #   1. 完整 SupCon 权重（backbone + feature_fusion + projection_head）
  #      推荐：命令行 MoCo 训练产物经 scripts/convert_checkpoint_to_weights.py --strip-moco 转换后使用
  #      加载：strict=True 全量匹配；键名须与 ConvNeXtModel/ViTModel 一致（backbone.* 等，无 query_encoder. 前缀）
  #   2. 仅 DINOv3 backbone（pretrain_ckpts/<backbone>.pth）
  #      加载：构建时只注入 backbone.stages.*，fusion/head 随机初始化
  #
  # 实验 config 的 pretrainedPath 可覆盖此处路径（优先级更高）。
  pretrained_models:
    convnext_tiny:
      backbone_config: "configs/backbone/convnext_tiny.yaml"
      pretrained_path: "checkpoints/supcon_models/0707_convnext_tiny/current_model_inference.pth"


  # ---------- DINOv3 RAW 推理模型（推理页下拉选项） ----------
  # key 即 API / UI 的 model_id；使用原始 DINOv3 backbone + 全局平均池化（无训练 head）。
  # backbone_config 复用 configs/backbone/<backbone>.yaml，无需在此重复。
  default_models:
    convnext_tiny:
      name: "Tiny"
      backbone: convnext_tiny
      pretrained_path: "pretrain_ckpts/convnext_tiny.pth"
    convnext_small:
      name: "Small"
      backbone: convnext_small
      pretrained_path: "pretrain_ckpts/convnext_small.pth"
    convnext_base:
      name: "Base"
      backbone: convnext_base
      pretrained_path: "pretrain_ckpts/convnext_base.pth"
    convnext_large:
      name: "Large"
      backbone: convnext_large
      pretrained_path: "pretrain_ckpts/convnext_large.pth"

  # ---------- 训练默认参数 ----------
  # Web UI 创建实验时可覆盖这些值
  training:
    default_backbone: "convnext_tiny"
    learning_rate: 1e-4
    use_amp: true
    # 早停：验证 margin 连续 early_stop_patience 次提升不超过
    # early_stop_min_delta 就提前结束训练；设为 0 关闭早停。
    early_stop_patience: 5
    early_stop_min_delta: 0.005
    lr_scheduler: "cosine"   # 'cosine' | 'step'
    freeze_backbone: true
    # lr 按「实际生效 batch_size」线性缩放（batch 越大 lr 越大，clamp 到 [0.25,4]×）。
    # lr_reference_batch_size 是 learning_rate 对应的基准 batch；设 false 关闭缩放。
    lr_batch_scaling: true
    lr_reference_batch_size: 64
    # 训练设备：cpu 或 gpu
    device: gpu
    # 训练过程中是否做验证：true=每个检查点都 eval（约 10 次，含早停）；
    # false=训练过程不 eval，全部 step 跑完后再对最终模型 eval 一次。
    use_eval: true

  # ---------- 数据默认参数（Web 平台） ----------
  # batch_size 影响 step 预算估算与对比学习 batch 共现；运行时 clamp 到
  # min(batch_size, 数据集样本数)。num_workers 为数据加载/增强并行进程数
  # （验证集 batch 数过少时仍会自动降级为 0）。
  data:
    batch_size: 128
    num_workers: 8

  # ---------- 输出默认 ----------
  output:
    log_dir: "logs/data_cluster"
