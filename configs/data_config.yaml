# 数据配置
data:
  # 原始数据路径
  raw_data_root: "data/raw"
  
  # 处理后的数据路径
  patches_root: "data/patches"
  metadata_root: "data/metadata"
  embeddings_root: "data/embeddings"
  
  # 支持的工业场景（domain_id列表）
  domains:
    - "bottle"
    - "cable"
    - "capsule"
    - "carpet"
    - "grid"
    - "hazelnut"
    - "leather"
    - "metal_nut"
    - "pill"
    - "screw"
    - "tile"
    - "toothbrush"
    - "transistor"
    - "wood"
    - "zipper"
  
  # Patch提取配置
  patch:
    size: 224  # patch大小 (224x224 或 256x256)
    expand_ratio: 0.1  # 扩边比例（相对于mask外接矩形）
    min_size: 32  # 最小patch尺寸
  
  # 数据过滤配置
  filtering:
    min_samples_per_class: 5  # 每个类别最少样本数
    max_samples_per_class: 10000  # 每个类别最多样本数（用于平衡）

