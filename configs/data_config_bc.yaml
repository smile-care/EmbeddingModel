# 对比学习数据集配置
#
# scenes.train: 训练集列表，每项为 {name, root}，root 直接指向包含类别子目录的目录
# scenes.val:   验证集列表（可选），格式同 train；不设则跳过验证
#
# 单数据集示例：train 下只写一项即可
# 多数据集示例：train 下写多项，类别会自动取并集

scenes:
  train:
  - name: zhenyu_2025-1201-5.x
    root: data/datasets/zhenyu/2025-1201-5.x/train
  - name: zhenyu_2025-1219
    root: data/datasets/zhenyu/2025-1219/train
  - name: zhenyu_2026-0105
    root: data/datasets/zhenyu/2026-0105/train

  val:
  - name: zhenyu_2025-1201-5.x
    root: data/datasets/zhenyu/2025-1201-5.x/val
  - name: zhenyu_2025-1219
    root: data/datasets/zhenyu/2025-1219/val

debug_mode: false
