[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embedding-model"
version = "0.2.0"
description = "Industrial Defect Universal Embedding Model with SupCon and MoCo"
authors = [{name = "Huang Junhong"}]
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "scikit-learn>=1.3.0",
    "faiss-cpu>=1.7.4",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "wandb>=0.15.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0",
    "scipy>=1.11.0",
    "transformers==4.57.3",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = {find = {where = ["src"]}}

[tool.setuptools.package-data]
"embedding_model" = ["**/*.yaml"]
